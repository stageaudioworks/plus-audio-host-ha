name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"          # weekly: catches Home Assistant or HACS rule changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # HACS only validates public repositories; this runs once the repository is made public
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  meters:
    # the live meters, against a fake processor: needs nothing private, so it always runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          pip install pytest-homeassistant-custom-component
          pytest tests_meters -v
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --check custom_components/plus_audio_host/frontend/plus-audio-meters-card.js

  tests:
    # Home Assistant against the processor's real control software. Needs read access to the private processor
    # repository: a fine-grained token with Contents: read on stageaudioworks/plus-audio-bmp, as the secret BMP_REPO_TOKEN.
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.BMP_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Processor software
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v5
        with:
          repository: stageaudioworks/plus-audio-bmp
          token: ${{ secrets.BMP_REPO_TOKEN }}
          path: bmp
          sparse-checkout: control
      - uses: actions/setup-python@v6
        if: env.HAS_TOKEN == 'true'
        with:
          python-version: "3.13"
      - name: Tests
        if: env.HAS_TOKEN == 'true'
        run: |
          pip install pytest-homeassistant-custom-component
          BMP_ROOT=$GITHUB_WORKSPACE/bmp pytest tests -v
      - name: Skipped
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Tests skipped - add the BMP_REPO_TOKEN secret to run them"
